name: CI/CD Pipeline
on:
  pull_request_review:
    types: [submitted]
env:
  PROJECT_ID: code-assignment-10
  CLUSTER_NAME: plaza-devops-gke
  CLUSTER_LOCATION: europe-north1-a
  WORKLOAD_IDENTITY_PROVIDER: projects/365047560923/locations/global/workloadIdentityPools/pricer-github-pool/providers/github-actions
  SERVICE_ACCOUNT: coding-assignment-sa@code-assignment-10.iam.gserviceaccount.com
  USE_GKE_GCLOUD_AUTH_PLUGIN: True
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved'
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          export candidate=$(echo '${{ github.event.pull_request.head.ref }}' | sed 's/candidate-//')
          export image_repository=europe-north1-docker.pkg.dev/${{ env.PROJECT_ID }}/code-assignment-docker/webapp-$candidate
          echo "candidate=$candidate" >> $GITHUB_ENV
          echo "image_repository=$image_repository" >> $GITHUB_ENV
          echo "TF_VAR_namespace=candidate-$candidate" >> $GITHUB_ENV
          echo "TF_VAR_helm_release_name=candidate-$candidate" >> $GITHUB_ENV
          echo "TF_VAR_image_repository=$image_repository" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run tests
        run: |
          pip install -r webapp/requirements.txt
          pytest webapp/tests/ -v

      - name: Setup Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker login for Artifact Registry
        run: |
          gcloud auth configure-docker -q europe-north1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.image_repository }}:${{ github.sha }} -t ${{ env.image_repository }}:latest ./webapp
          docker push ${{ env.image_repository }}:${{ github.sha }}
          docker push ${{ env.image_repository }}:latest
          echo "TF_VAR_image_tag=${{ github.sha }}" >> $GITHUB_ENV

      - name: Configure GKE cluster access
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.CLUSTER_LOCATION }}
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Deploy with Terraform
        run: |
          cd services
          terraform init
          terraform apply -auto-approve
